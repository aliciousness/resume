<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background-color: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .gundam-container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
    }
    .gundam-container img {
      max-width: 400px;
      height: auto;
      opacity: 0.8;
    }
    .scrolling-wrapper {
      position: fixed;
      top: 50%;
      width: 100%;
      height: 50px;
      overflow: hidden;
      z-index: 2;
    }
    .scrolling-text {
      position: absolute;
      white-space: nowrap;
      animation: scroll-text 15s linear infinite;
      font-size: 2rem;
      width: 100%;
      text-align: center;
    }
    @keyframes scroll-text {
      from {
        transform: translateX(100%);
      }
      to {
        transform: translateX(-100%);
      }
    }
  </style>
</head>
<body>
  <div class="gundam-container">
    <img src="images/maintenance-gundam.png" alt="Maintenance Gundam">
  </div>
  <div class="scrolling-wrapper">
    <div class="scrolling-text">
      ahhh... I think you're a bit lost
    </div>
  </div>
</body>
</html>
